name: Dependency Security

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
    inputs:
      confirm_dependency_metadata:
        description: Send dependency names and versions to npm Advisory
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: dependency-security
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name == 'schedule' || inputs.confirm_dependency_metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.20.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Report production dependency licenses
        run: pnpm licenses list --prod --long
