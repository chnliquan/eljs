name: Dependency Security

on:
  workflow_dispatch:
    inputs:
      confirm_dependency_metadata:
        description: Send dependency names and versions to npm Advisory
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: dependency-security
  cancel-in-progress: true

jobs:
  audit:
    if: inputs.confirm_dependency_metadata
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Report production dependency licenses
        run: pnpm licenses list --prod --long
