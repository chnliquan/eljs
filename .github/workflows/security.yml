name: Dependency Security

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
    inputs:
      confirm_dependency_metadata:
        description: Send dependency names and versions to npm Advisory
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: dependency-security
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name == 'schedule' || inputs.confirm_dependency_metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Report production dependency licenses
        run: pnpm licenses list --prod --long
