name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.14.0
          - 24

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Static verification
        if: matrix.node == 24
        run: pnpm verify:static

      - name: Tests with coverage
        if: matrix.node == 24
        run: pnpm verify:test

      - name: Verify official template contracts
        if: matrix.node == 24
        run: pnpm exec vitest run packages/create-template/__tests__/official-templates.integration.spec.ts --coverage.enabled=false
        env:
          ELJS_TEST_OFFICIAL_TEMPLATES: '1'

      - name: Runtime compatibility tests
        if: matrix.node != 24
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify package runtime, types, and contents
        run: pnpm pack:check

  platform:
    name: Runtime on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Runtime compatibility tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify package runtime, types, and contents
        run: pnpm pack:check
