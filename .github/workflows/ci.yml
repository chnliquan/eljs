name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.14.0
          - 24

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Static verification
        if: matrix.node == 24
        run: pnpm verify:static

      - name: Tests with coverage
        if: matrix.node == 24
        run: pnpm verify:test

      - name: Verify official template contracts
        if: matrix.node == 24
        run: pnpm exec vitest run packages/create-template/__tests__/official-templates.integration.spec.ts --coverage.enabled=false
        env:
          ELJS_TEST_OFFICIAL_TEMPLATES: '1'

      - name: Runtime compatibility tests
        if: matrix.node != 24
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify package runtime, types, and contents
        run: pnpm pack:check

  platform:
    name: Runtime on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Runtime compatibility tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify package runtime, types, and contents
        run: pnpm pack:check
